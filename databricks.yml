bundle:
  name: elio_pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the pipeline reads from and writes to
    default: elio_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-3e9dd53b-aa0b.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-3e9dd53b-aa0b.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: elio_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE