name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: Run the pipeline job after deploying
        type: boolean
        default: false

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.16.1
      - run: databricks bundle deploy -t prod
      - if: ${{ inputs.run_pipeline }}
        run: databricks bundle run elio_pipeline -t prod